name: BoltX KSUN 248 STAGING

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Custom Kernel Name (Leave empty for default)'
        required: false
        default: ''
        type: string
      release_status:
        description: 'Release Status'
        required: true
        type: choice
        default: 'RELEASE'
        options:
          - 'RELEASE'
          - 'BETA'
      clang_version:
        description: 'Select Clang Version'
        required: true
        type: choice
        options:
          - 'r416183b (Clang 12)'
          - 'r536225 (Clang 19)'
          - 'r547379 (Clang 20)'
      hook_method:
        description: 'Select Hook Method'
        required: true
        type: choice
        default: 'susfs'
        options:
          - 'susfs'
          - 'kprobes'
      performance_patch:
        description: 'Select Device SoC for Performance Tuning'
        required: true
        type: choice
        default: 'Snapdragon'
        options:
          - 'Snapdragon'
          - 'MediaTek'

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "titit"
          git config --global user.email "Kingfinik98@gmail.com"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl repo build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip unzip zip rsync libncurses-dev pahole cpio \
            lld binutils-aarch64-linux-gnu ccache

      - name: Init & Sync GKI source
        run: |
          mkdir -p gki && cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Update kernel source (staging branch)
        working-directory: gki/common
        run: |
          git remote add rama https://github.com/ramabondanp/android_kernel_common-5.10.git
          git fetch -j$(nproc --all) rama
          git checkout -b update-android12-5.10-staging rama/android12-5.10-staging || git checkout update-android12-5.10-staging
          rm -rf drivers/staging/kernelsu

      - name: Apply Snapdragon Performance Patch
        if: github.event.inputs.performance_patch == 'Snapdragon'
        working-directory: gki/common
        run: |
          TARGET="drivers/cpufreq/qcom-cpufreq-hw.c"
          SRC_URL="https://raw.githubusercontent.com/Pzqqt/android_kernel_xiaomi_marble/melt-rebase/drivers/cpufreq/qcom-cpufreq-hw.c"
          curl -L "$SRC_URL" -o /tmp/qcom-cpufreq-hw.c
          if ! grep -q "qcom_cpufreq_hw" /tmp/qcom-cpufreq-hw.c; then echo "Patch source invalid"; exit 1; fi
          cp /tmp/qcom-cpufreq-hw.c "$TARGET"
          echo "Snapdragon qcom-cpufreq-hw performance patch applied"

      - name: Setup KernelSU-Next & Hook Method
        working-directory: gki/common
        run: |
          set -e
          rm -rf drivers/staging/kernelsu drivers/kernelsu KernelSU 2>/dev/null || true

          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs

          sed -i 's/$(error KSU requires Kprobes.*)/# &/' drivers/kernelsu/Kbuild || true

          HOOK_METHOD="${{ github.event.inputs.hook_method }}"
          if [ "$HOOK_METHOD" = "susfs" ]; then
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 sus
            cp -r sus/kernel_patches/fs .
            cp -r sus/kernel_patches/include .
            cp sus/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch .
            patch -p1 --dry-run < 50_add_susfs_in_gki-android12-5.10.patch || { echo "SUSFS patch dry-run failed"; exit 1; }
            patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
            sed -i '1i#include <linux/stat.h>' include/linux/susfs.h
          fi

      - name: Apply common fixes & configs
        working-directory: gki/common
        run: |
          # Stack protector fix
          sed -i '/config STACKPROTECTOR_PER_TASK/{n;s/def_bool y/bool "Stack Protector per task"\n\tdefault y/;}' arch/arm64/Kconfig
          echo "# CONFIG_STACKPROTECTOR_PER_TASK is not set" >> arch/arm64/configs/gki_defconfig

          # Xiaomi compat
          sed -i '/pr_warn.*disagrees about version of symbol.*/,+1 s/.*/return 1;/' kernel/module.c
          sed -i '/^static int drm_atomic_check_valid_clones/,/^}/d' drivers/gpu/drm/drm_atomic_helper.c

          # Remove check_defconfig if present
          sed -i '/check_defconfig/d' build.config.gki || true

      - name: Inject kernel configs
        working-directory: gki/common
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          HOOK_METHOD="${{ github.event.inputs.hook_method }}"
          PERFORMANCE_PATCH="${{ github.event.inputs.performance_patch }}"

          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_MQ_IOSCHED_BFQ=y
          CONFIG_IOSCHED_BFQ=y
          CONFIG_BFQ_GROUP_IOSCHED=y
          EOF

          if [ "$HOOK_METHOD" = "susfs" ]; then
            cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          EOF
          fi

          if [ "$PERFORMANCE_PATCH" = "MediaTek" ]; then
            echo "CONFIG_HZ=500" >> "$DEFCONFIG"
          fi

      - name: Setup Clang (AOSP prebuilt)
        working-directory: gki
        run: |
          set -e
          mkdir -p prebuilts-master/clang/host/linux-x86
          cd prebuilts-master/clang/host/linux-x86

          if [ "${{ github.event.inputs.clang_version }}" == "r416183b (Clang 12)" ]; then
            CLANG_VER="clang-r416183b"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz"
          elif [ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]; then
            CLANG_VER="clang-r536225"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"
          else
            CLANG_VER="clang-r547379"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
          fi

          echo "Downloading $CLANG_VER..."
          curl -L --retry 5 --retry-delay 5 "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

          ln -sf $CLANG_VER clang-r416183b || true

          echo "CLANG_BIN_DIR=$(pwd)/$CLANG_VER/bin" >> $GITHUB_ENV
          $(pwd)/$CLANG_VER/bin/clang --version

      - name: Set kernel version suffix
        working-directory: gki/common
        run: |
          SUFFIX=""
          [ -n "${{ github.event.inputs.kernel_name }}" ] && SUFFIX="-${{ github.event.inputs.kernel_name }}"
          [ "${{ github.event.inputs.hook_method }}" = "susfs" ] && SUFFIX="$SUFFIX-ඞ-SuS"
          [ "${{ github.event.inputs.performance_patch }}" = "Snapdragon" ] && SUFFIX="$SUFFIX-Qcom" || SUFFIX="$SUFFIX-Mtk"

          sed -i "/^EXTRAVERSION *=/d" Makefile
          echo "EXTRAVERSION = $SUFFIX" >> Makefile

      - name: Compile kernel
        working-directory: gki
        run: |
          export PATH="${{ env.CLANG_BIN_DIR }}:$PATH"
          export CC="ccache clang"
          export LD="ccache ld.lld"
          export HOSTCC="ccache clang"
          export HOSTLD="ccache ld.lld"

          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Prepare packaging info
        id: vars
        run: |
          cd gki/common
          BASE_LINUX_VERSION=$(make -s kernelversion | tr -d '\n\r')
          echo "BASE_LINUX_VERSION=$BASE_LINUX_VERSION" >> $GITHUB_ENV

          KERNEL_NAME="${{ github.event.inputs.kernel_name }}"
          [ -z "$KERNEL_NAME" ] && KERNEL_NAME="BoltX"

          VARIANT="${{ github.event.inputs.hook_method == 'susfs' && 'SusFS' || 'Kprobes' }}"
          BUILD_DATE=$(date +"%Y%m%d")
          RELEASE="v${BUILD_DATE}"
          AK3_ZIP_NAME="AK3-${KERNEL_NAME}-${RELEASE}-${BASE_LINUX_VERSION}-${VARIANT}.zip"

          echo "KERNEL_NAME=$KERNEL_NAME" >> $GITHUB_ENV
          echo "VARIANT=$VARIANT" >> $GITHUB_ENV
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "AK3_ZIP_NAME=$AK3_ZIP_NAME" >> $GITHUB_ENV

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/linastorvaldz/anykernel -b android12-5.10 anykernel
          cd anykernel

          KERNEL_IMAGE="../out/android12-5.10/common/arch/arm64/boot/Image.lz4"
          [ -f "$KERNEL_IMAGE" ] || { echo "Image.lz4 not found"; exit 1; }

          cp "$KERNEL_IMAGE" Image.lz4
          zip -r9 "../${{ env.AK3_ZIP_NAME }}" ./*

      - name: Upload kernel zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AK3_ZIP_NAME || 'build-failed' }}
          path: ${{ env.AK3_ZIP_NAME }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: gki/out/android12-5.10/common/build.log
