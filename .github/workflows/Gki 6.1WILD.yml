name: Build GKI 6.1 WILDKSU

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Nama Kernel (Opsional)'
        required: false
        default: ''
      clang_version:
        description: 'Versi Clang'
        required: true
        default: 'r536225 (Clang 19)'
        type: choice
        options:
        - 'r536225 (Clang 19)'
        - 'r547379 (Clang 20)'
      release_status:
        description: 'Status Release'
        required: false
        default: 'Stable'
      hook_method:
        description: 'Metode Hook'
        required: false
        default: 'susfs'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build tools
        run: |
          apt update && apt upgrade -y
          apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Clone Kernel Source
        run: |
          echo "⬇️ Cloning Kernel Source (ramabondanp - Branch: android14-6.1)..."
          mkdir -p gki
          git clone --depth=1 -b android14-6.1 https://github.com/ramabondanp/android_kernel_common-6.1 gki/common
          
      - name: Update kernel source for GKI 6.1
        run: |
          cd gki/common
          echo "⬇️ Cloning remote Source (ramabondanp - Branch: android14-6.1-lazygoogle)..."
          mkdir -p gki
          git remote add Kingfinik98 https://github.com/Kingfinik98/android_kernel_common-6.1.git
          git fetch -j12 Kingfinik98
          git checkout -b update-android14-6.1-lazygoogle Kingfinik98/android14-6.1-lazygoogle
          # delet drivers staging KernelSU
          rm -rf drivers/staging/kernelsu

      - name: Setup Custom Clang
        working-directory: gki
        shell: bash
        run: |
          mkdir -p toolchain/clang
          
          if [[ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]]; then
            echo "Setting up Clang-19 (r536225)..."
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          else
            echo "Setting up Clang-20 (r547379)..."
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          fi
          
          echo "Downloading Clang..."
          curl -L "${CLANG_URL}" | tar -xz -C toolchain/clang

      - name: Patch KernelSU (Wild_KSU)
        working-directory: gki/common
        run: |
          echo "Setting up Wild_KSU..."
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild

      - name: Patch SuSFS (Manual + Kstat Fix)
        working-directory: gki/common
        run: |
          echo "Cloning SUSFS Patches (Branch: gki-android14-6.1)..."
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android14-6.1 sus_temp
          
          echo "Copying patch files..."
          cp -r sus_temp/kernel_patches/fs/* fs/
          cp -r sus_temp/kernel_patches/include/* include/
          cp sus_temp/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch .
          
          echo "Applying SUSFS Patch..."
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true
          
          echo "🔥 FIXING Headers Dependencies..."
          
          # FIX 1: Tambahkan <linux/stat.h> ke include/linux/susfs.h 
          sed -i '1i#include <linux/stat.h>' include/linux/susfs.h
          
          # FIX 2: Inject header ke fs/proc/base.c di baris pertama
          sed -i '/#include <linux\/susfs.h>/d' fs/proc/base.c
          sed -i '1i#include <linux/susfs.h>' fs/proc/base.c
          
          echo "✅ Headers fixed."
          rm -rf sus_temp 50_add_susfs_in_gki-android14-6.1.patch fs/proc/base.c.rej

      - name: Configure Kernel
        working-directory: gki/common
        shell: bash
        run: |
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Generating GKI defconfig..."
          make O=out gki_defconfig

          echo "⚙️ Injecting Configs..."
          
          # Inject Config: KSU, KPatch, SuSFS
          cat <<EOF >> out/.config
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_KSU_SYSCALL_HOOK=n
          CONFIG_KSU_KPATCH=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_MANUAL_HOOK=n
          CONFIG_KSU_HAS_MANUAL_HOOK=n
          EOF

          # Inject Config: Performance
          cat <<EOF >> out/.config
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_BBR=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_SCHED_TUNE=y
          CONFIG_MQ_IOSCHED_KYBER=y
          CONFIG_MQ_IOSCHED_BFQ=y
          CONFIG_IOSCHED_BFQ=y
          CONFIG_BFQ_GROUP_IOSCHED=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_WRITEBACK=y
          EOF

          # Set Local Version
          if [[ ! -z "${{ github.event.inputs.kernel_name }}" ]]; then
            scripts/config --file out/.config --set-str LOCALVERSION "-${{ github.event.inputs.kernel_name }}"
          else
            scripts/config --file out/.config --set-str LOCALVERSION ""
          fi

          # Config LTO
          scripts/config --file out/.config \
              -e LTO_CLANG \
              -d LTO_NONE \
              -e LTO_CLANG_THIN \
              -d LTO_CLANG_FULL \
              -e THINLTO

          # FIX ERROR BTF (pahole not found)
          # Nonaktifkan BTF agar build tidak gagal karena tool pahole tidak ada
          scripts/config --file out/.config -d DEBUG_INFO_BTF
              
          echo "🔧 Running olddefconfig..."
          make O=out olddefconfig

      - name: Build Kernel Image
        working-directory: gki/common
        run: |
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          echo "Starting Build..."
          make -j"$(nproc --all)" O=out Image 2>&1 | tee build.log

      - name: Setup Environment Variables for Packaging
        id: vars
        run: |
          # Ambil versi DASAR kernel
          BASE_LINUX_VERSION=$(make -s kernelversion -C gki/common | tr -d '\n\r')
          echo "BASE_LINUX_VERSION=$BASE_LINUX_VERSION" >> $GITHUB_ENV
          
          # Ambil versi LENGKAP kernel (dengan suffix)
          LINUX_VERSION=$(make -s kernelversion -C gki/common | tr -d '\n\r')
          echo "LINUX_VERSION=$LINUX_VERSION" >> $GITHUB_ENV
          
          CUSTOM_KERNEL_NAME="${{ github.event.inputs.kernel_name }}"
          if [ -z "$CUSTOM_KERNEL_NAME" ]; then
            KERNEL_NAME="BoltX"
          else
            KERNEL_NAME="$CUSTOM_KERNEL_NAME"
          fi

          HOOK_METHOD="${{ github.event.inputs.hook_method }}"
          STATUS="${{ github.event.inputs.release_status }}"
          CLANG_VERSION_STRING="${{ github.event.inputs.clang_version }}"

          # Tentukan nama Varian untuk nama file zip
          if [ "$HOOK_METHOD" = "susfs" ]; then
            VARIANT="SusFS"
          else
            VARIANT="Kprobes"
          fi

          BUILD_DATE=$(date +"%Y%m%d")
          KBUILD_BUILD_TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S %Z")
          RELEASE="v${BUILD_DATE}"
          
          # --- PERUBAHAN NAMA FILE ZIP LEBIH RAPI ---
          AK3_ZIP_NAME="AK3-${KERNEL_NAME}-${RELEASE}-${BASE_LINUX_VERSION}-${VARIANT}.zip"
          
          echo "KERNEL_NAME=$KERNEL_NAME" >> $GITHUB_ENV
          echo "VARIANT=$VARIANT" >> $GITHUB_ENV
          echo "STATUS=$STATUS" >> $GITHUB_ENV
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "AK3_ZIP_NAME=$AK3_ZIP_NAME" >> $GITHUB_ENV
          echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> $GITHUB_ENV
          echo "KSU=Wild_KSU" >> $GITHUB_ENV
          echo "SUSFS_VERSION=$(curl -s https://gitlab.com/simonpunk/susfs4ksu/raw/gki-android14-6.1/kernel_patches/include/linux/susfs.h | grep -E '^#define SUSFS_VERSION' | cut -d' ' -f3 | sed 's/"//g')" >> $GITHUB_ENV
          echo "COMPILER_STRING=$CLANG_VERSION_STRING" >> $GITHUB_ENV

      - name: Package Kernel (AnyKernel3)
        run: |
          echo "🚀 Starting kernel packaging process..."
          ANYKERNEL_REPO="https://github.com/linastorvaldz/anykernel"
          ANYKERNEL_BRANCH="android12-5.10" 
          KERNEL_IMAGE="$GITHUB_WORKSPACE/gki/common/out/arch/arm64/boot/Image"
          echo "🔽 Cloning anykernel from $ANYKERNEL_REPO"
          git clone -q --depth=1 $ANYKERNEL_REPO -b $ANYKERNEL_BRANCH anykernel
          
          # --- PERUBAHAN: GUNAKAN VERSI LENGKAP UNTUK KERNEL STRING ---
          KERNEL_STRING="${{ env.LINUX_VERSION }}"
          sed -i "s|kernel.string=.*|kernel.string=$KERNEL_STRING|g" anykernel/anykernel.sh

          cd anykernel
          echo "🗜️ Zipping anykernel..."
          cp "$KERNEL_IMAGE" .
          zip -r9 ../${{ env.AK3_ZIP_NAME }} ./*
          cd ..
          echo "✅ Zip file created: ${{ env.AK3_ZIP_NAME }}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🚀 Creating GitHub Release..."
          GKI_RELEASES_REPO="https://github.com/Kingfinik98/Kernel-Release"
          REPO_PATH=$(echo "$GKI_RELEASES_REPO" | sed 's|https://github.com/||')
          RELEASE_TAG="${{ env.KERNEL_NAME }}-${{ env.LINUX_VERSION }}-${{ env.RELEASE }}"
          RELEASE_NOTES="🐧 *Linux Version*: ${{ env.LINUX_VERSION }}
          📅 *Build Date*: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          📛 *KernelSU*: ${{ env.KSU }}
          ඞ *SuSFS*: ${{ env.SUSFS_VERSION }}
          🔰 *Compiler*: ${{ env.COMPILER_STRING }}
          🔗 *Hook Method*: ${{ env.HOOK_METHOD }}"
          gh release create "$RELEASE_TAG" "${{ env.AK3_ZIP_NAME }}" \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_NOTES" \
            --repo "$REPO_PATH" \
            --latest
          echo "✅ Release created successfully at https://github.com/$REPO_PATH/releases/tag/$RELEASE_TAG"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gki/common/build.log
          if-no-files-found: warn
